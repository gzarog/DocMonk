[workspace]
resolver = "2"
members = [
    "crates/docmonk-ai",
    "crates/docmonk-backends",
    "crates/docmonk-cli",
    "crates/docmonk-code",
    "crates/docmonk-config",
    "crates/docmonk-convert",
    "crates/docmonk-core",
    "crates/docmonk-documents",
    "crates/docmonk-indexing",
    "crates/docmonk-knowledge",
    "crates/docmonk-ml",
    "crates/docmonk-mcp",
    "crates/docmonk-ops",
    "crates/docmonk-retrieval",
    "crates/docmonk-service",
    "crates/docmonk-status",
    "crates/docmonk-storage",
    "crates/docmonk-telemetry",
    "crates/docmonk-ui",
    "crates/docmonk-update",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "form", "json"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.3"
minijinja = { version = "2", features = ["loader", "json"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
signal-hook = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "signal"] }
docmonk-ai = { path = "crates/docmonk-ai" }
docmonk-backends = { path = "crates/docmonk-backends" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dunce = "1"
docmonk-code = { path = "crates/docmonk-code" }
docmonk-convert = { path = "crates/docmonk-convert" }
docmonk-config = { path = "crates/docmonk-config" }
docmonk-documents = { path = "crates/docmonk-documents" }
docmonk-core = { path = "crates/docmonk-core" }
docmonk-ml = { path = "crates/docmonk-ml" }
docmonk-knowledge = { path = "crates/docmonk-knowledge" }
docmonk-retrieval = { path = "crates/docmonk-retrieval" }
docmonk-service = { path = "crates/docmonk-service" }
docmonk-status = { path = "crates/docmonk-status" }
docmonk-ops = { path = "crates/docmonk-ops" }
docmonk-mcp = { path = "crates/docmonk-mcp" }
docmonk-ui = { path = "crates/docmonk-ui" }
docmonk-indexing = { path = "crates/docmonk-indexing" }
docmonk-storage = { path = "crates/docmonk-storage" }
docmonk-telemetry = { path = "crates/docmonk-telemetry" }
docmonk-update = { path = "crates/docmonk-update" }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
notify = "8.2"
regex = "1"
roxmltree = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-native-roots", "json"] }
rusqlite = { version = "0.32", features = ["bundled", "trace", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
unicode-normalization = "0.1"
yaml-rust2 = "0.10"

# Inference/decoding crates are unusably slow unoptimized; tests run in the
# dev profile, so build these optimized there too.
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-imageproc]
opt-level = 3
[profile.dev.package.ocrs]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.tokenizers]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-model-file]
opt-level = 3
[profile.dev.package.rten-shape-inference]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.gemm-f16]
opt-level = 3
[profile.dev.package.half]
opt-level = 3
[profile.dev.package.pulp]
opt-level = 3
[profile.dev.package.safetensors]
opt-level = 3
