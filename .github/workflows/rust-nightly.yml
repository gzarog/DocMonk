name: Nightly

# The release-mode status benchmark (ADR 0034: 150 sources in <= 30
# requests, a watch refresh in < 10) against both engines, and the
# retrieval eval over this repository with the pinned models (all arms
# against fixtures/search_quality/repo-eval-gates.json). Moved out of
# routine CI (docs/CI.md); neither publishes anything.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  status-benchmark:
    name: Status benchmark (150 sources, both engines)
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:2.15.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports:
          - 9201:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports:
          - 9202:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      DOCMONK_TEST_OPENSEARCH_URL: http://localhost:9201
      DOCMONK_TEST_ELASTICSEARCH_URL: http://localhost:9202
      DOCMONK_REQUIRE_LIVE_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Wait for clusters
        run: |
          for url in "$DOCMONK_TEST_OPENSEARCH_URL" "$DOCMONK_TEST_ELASTICSEARCH_URL"; do
            for i in $(seq 1 60); do
              curl -fs "$url/_cluster/health?wait_for_status=yellow&timeout=5s" && break
              sleep 5
            done
          done
      - name: Status benchmark (150 sources, both engines)
        shell: bash
        run: |
          set -o pipefail
          start=$(date +%s)
          cargo test --release -p docmonk-status --test live_server -- --ignored --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/benchmark.log"
          echo "duration_seconds=$(( $(date +%s) - start ))" | tee -a "$RUNNER_TEMP/benchmark.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: status-benchmark-log
          path: ${{ runner.temp }}/benchmark.log
          retention-days: 14

  retrieval-eval:
    name: Retrieval eval (repository, pinned models)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/fetch-models
        with:
          dir: ${{ runner.temp }}
      - name: Repository retrieval eval (lexical, routed, hybrid, hybrid_rerank)
        run: cargo test --release -p docmonk-service --test repo_eval -- --nocapture
        env:
          DOCMONK_REPO_EVAL: "1"
          DOCMONK_MODELS_DIR: ${{ runner.temp }}/models
          DOCMONK_REQUIRE_MODELS: "1"
          DOCMONK_EVAL_OUT: ${{ runner.temp }}/repo-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repo-eval-report
          path: ${{ runner.temp }}/repo-eval.json
          if-no-files-found: ignore
          retention-days: 14

  # Advisories published since the last PR (deny.toml). A failure opens,
  # or comments on, one open issue labelled `security-advisory`, so
  # repeated nightly failures never pile up duplicate issues.
  advisories:
    name: Dependency advisories (cargo deny)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - id: deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        continue-on-error: true
        with:
          command: check advisories
      - name: Report to one issue
        if: steps.deny.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="Nightly: cargo deny advisories failing on main"
          body="\`cargo deny check advisories\` failed on $(git rev-parse --short HEAD): $RUN_URL"
          gh label create security-advisory --color B60205 --force >/dev/null
          number=$(gh issue list --label security-advisory --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --label security-advisory --body "$body"
          fi
          exit 1
