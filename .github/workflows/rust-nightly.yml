name: Nightly

# The release-mode status benchmark (ADR 0034: 150 sources in <= 30
# requests, a watch refresh in < 10) against both engines. Moved out of
# routine CI (docs/CI.md); it never publishes anything.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  status-benchmark:
    name: Status benchmark (150 sources, both engines)
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:2.15.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports:
          - 9201:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports:
          - 9202:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      RAGMONK_TEST_OPENSEARCH_URL: http://localhost:9201
      RAGMONK_TEST_ELASTICSEARCH_URL: http://localhost:9202
      RAGMONK_REQUIRE_LIVE_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Wait for clusters
        run: |
          for url in "$RAGMONK_TEST_OPENSEARCH_URL" "$RAGMONK_TEST_ELASTICSEARCH_URL"; do
            for i in $(seq 1 60); do
              curl -fs "$url/_cluster/health?wait_for_status=yellow&timeout=5s" && break
              sleep 5
            done
          done
      - name: Status benchmark (150 sources, both engines)
        shell: bash
        run: |
          set -o pipefail
          start=$(date +%s)
          cargo test --release -p docmonk-status --test live_server -- --ignored --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/benchmark.log"
          echo "duration_seconds=$(( $(date +%s) - start ))" | tee -a "$RUNNER_TEMP/benchmark.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: status-benchmark-log
          path: ${{ runner.temp }}/benchmark.log
          retention-days: 14
