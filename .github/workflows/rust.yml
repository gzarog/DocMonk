name: CI

on:
  pull_request:
  push:
    branches: ["main"]

# A newer push to the same PR supersedes its running CI. Pushes get a
# unique group (the run id) and are never cancelled: a green main push
# is what rust-release.yml publishes from.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which conditional PR jobs this change needs (docs/CI.md). Fail closed:
  # any error fails this job, and the CI gate fails with it. Pushes run
  # everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      installer: ${{ steps.classify.outputs.installer }}
      docker: ${{ steps.classify.outputs.docker }}
      cross_platform: ${{ steps.classify.outputs.cross_platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "installer=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            echo "cross_platform=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The PR checkout is the merge commit; its first parent is the base.
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          cat "$RUNNER_TEMP/changed"
          scripts/ci_changes.sh --self-test
          scripts/ci_changes.sh < "$RUNNER_TEMP/changed" | tee -a "$GITHUB_OUTPUT"

  # The former product name must not come back, and DocMonk 1.0 stays
  # fresh-install/fresh-index only (ADR 0032): the clean-slate baseline
  # only shrinks.
  repository-audits:
    name: Repository audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask branding-audit
      - run: cargo xtask clean-slate-audit
      # Open items in ADRs (in-progress status, measurements still to be
      # taken): printed, never failing.
      - run: cargo xtask adr-audit
      # Advisories, licences, bans and sources (deny.toml, ADR 0003).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  rust-linux:
    name: Rust fmt/clippy/test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Show toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: ./.github/actions/fetch-models
        with:
          dir: ${{ runner.temp }}
      - name: cargo test
        run: cargo test --workspace --no-fail-fast
        env:
          DOCMONK_OCR_MODELS_DIR: ${{ runner.temp }}/ocr-models
          DOCMONK_REQUIRE_OCR: "1"
          DOCMONK_MODELS_DIR: ${{ runner.temp }}/models
          DOCMONK_REQUIRE_MODELS: "1"
      # Release-mode build only on pushes; PRs stop at the debug tests.
      - name: cargo build --release
        if: github.event_name == 'push'
        run: cargo build --workspace --release

  # Windows/macOS: the same full checks plus the release build. Pushes
  # always run them; PRs only when `Detect changes` selects cross_platform
  # (shared build inputs, installer/updater, platform-specific sources).
  # Two plain jobs rather than a matrix, so a skipped run still shows the
  # OS in its name. Keep their steps identical.
  rust-windows:
    name: Rust fmt/clippy/test (windows-latest)
    needs: changes
    if: needs.changes.outputs.cross_platform == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Show toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: ./.github/actions/fetch-models
        with:
          dir: ${{ runner.temp }}
      - name: cargo test
        run: cargo test --workspace --no-fail-fast
        env:
          DOCMONK_OCR_MODELS_DIR: ${{ runner.temp }}/ocr-models
          DOCMONK_REQUIRE_OCR: "1"
          DOCMONK_MODELS_DIR: ${{ runner.temp }}/models
          DOCMONK_REQUIRE_MODELS: "1"
      - name: cargo build --release
        run: cargo build --workspace --release

  rust-macos:
    name: Rust fmt/clippy/test (macos-latest)
    needs: changes
    if: needs.changes.outputs.cross_platform == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Show toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: ./.github/actions/fetch-models
        with:
          dir: ${{ runner.temp }}
      - name: cargo test
        run: cargo test --workspace --no-fail-fast
        env:
          DOCMONK_OCR_MODELS_DIR: ${{ runner.temp }}/ocr-models
          DOCMONK_REQUIRE_OCR: "1"
          DOCMONK_MODELS_DIR: ${{ runner.temp }}/models
          DOCMONK_REQUIRE_MODELS: "1"
      - name: cargo build --release
        run: cargo build --workspace --release

  # Server index lifecycle against real, empty clusters: foreign-index
  # refusal, init, invisible-until-publish, crash/abort/GC, bounded bulk,
  # build mode, catalog paging past 10000 sources, lease fencing and k-NN;
  # then server mode end to end through the service layer.
  server-integration:
    name: Server integration (OpenSearch + Elasticsearch)
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:2.15.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports:
          - 9201:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports:
          - 9202:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      DOCMONK_TEST_OPENSEARCH_URL: http://localhost:9201
      DOCMONK_TEST_ELASTICSEARCH_URL: http://localhost:9202
      DOCMONK_REQUIRE_LIVE_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Wait for clusters
        run: |
          for url in "$DOCMONK_TEST_OPENSEARCH_URL" "$DOCMONK_TEST_ELASTICSEARCH_URL"; do
            for i in $(seq 1 60); do
              curl -fs "$url/_cluster/health?wait_for_status=yellow&timeout=5s" && break
              sleep 5
            done
          done
      - name: Live server lifecycle tests
        run: cargo test -p docmonk-backends --test it -- live:: --nocapture
      # Server mode end to end (ADR 0033): catalog, staged indexing with
      # copy-forward, queries, status, links, leases, offline safety and
      # the no-local-fallback guarantee, on both engines.
      - name: Server mode end-to-end tests
        run: cargo test -p docmonk-service --test it -- server_live:: --nocapture
      # The held-out retrieval evaluation on SQLite and both engines: the
      # same corpus and labels through every backend (docs/evaluation.md).
      - name: Held-out retrieval evaluation
        run: cargo test -p docmonk-service --test it -- heldout_eval:: --nocapture
      # The normalized lexical projection (ADR 0039) as one contract for
      # SQLite and both engines: accents, Greek and Arabic inflection,
      # unsegmented Japanese and Chinese.
      - name: Multilingual lexical contract
        run: cargo test -p docmonk-service --test it -- multilingual_lexical:: --nocapture
      # Filtered kNN recall against exact search after publication and GC,
      # and batched citation hydration (ADR 0041), on both engines.
      - name: Live ANN recall and citation hydration
        run: |
          cargo test --release -p docmonk-backends --test it -- ann_recall:: --nocapture
          cargo test -p docmonk-service --test it -- server_hydration:: --nocapture
      # Status (ADR 0034) on both engines: 150 sources in <= 30 requests,
      # a watch refresh in < 10, pending builds invisible, global error
      # order, two-host run visibility, fencing and expired leases; the
      # CLI in server mode never reads the home's SQLite.
      - name: Status live tests
        run: |
          cargo test -p docmonk-status --test it -- live_server:: --nocapture
          cargo test -p docmonk-cli --test it -- status:: --nocapture
      # The 150-source release-mode benchmark runs in rust-nightly.yml.

  # The native installers end to end, against release archives
  # packaged from this commit's build and served from a local directory
  # (DOCMONK_DOWNLOAD_BASE): install, re-install a second version, then
  # `docmonk update rollback` back to the first.
  install-script-tests:
    name: Install script (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ${{ matrix.os }}
    steps:
      # runner.temp is not available in job-level env.
      - name: Paths
        run: |
          for kv in DIST=dist DOCMONK_DOWNLOAD_BASE=dist DOCMONK_INSTALL_DIR=docmonk-install \
                    DOCMONK_BIN_DIR=docmonk-bin DOCMONK_HOME=docmonk-home; do
            echo "${kv%%=*}=$RUNNER_TEMP/${kv#*=}" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build and package two versions
        run: |
          cargo build -p docmonk-cli
          for v in 0.9.0 0.9.1; do
            cargo xtask package --binary target/debug/docmonk \
              --version "$v" --target "${{ matrix.target }}" --out "$DIST"
          done
          cat "$DIST/SHA256SUMS"
      - name: Install 0.9.0
        run: DOCMONK_VERSION=0.9.0 sh ./install.sh
      - name: Verify the installed CLI works
        run: |
          "$DOCMONK_BIN_DIR/docmonk" version
          "$DOCMONK_BIN_DIR/docmonk" doctor
          grep -q '"install_method": "native"' "$DOCMONK_HOME/install_info.json"
      - name: A tampered archive is refused
        run: |
          cp -R "$DIST" "$RUNNER_TEMP/bad" && echo x >> "$RUNNER_TEMP/bad/docmonk-0.9.1-${{ matrix.target }}.tar.gz"
          if DOCMONK_VERSION=0.9.1 DOCMONK_DOWNLOAD_BASE="$RUNNER_TEMP/bad" sh ./install.sh; then exit 1; fi
          test "$(readlink "$DOCMONK_INSTALL_DIR/current")" = "versions/0.9.0"
      # Fail-closed signature checks with a throwaway key (never a release
      # key): a valid signature installs; tampered SHA256SUMS, a missing
      # SHA256SUMS.minisig and a missing minisign tool are all refused.
      - name: Signature verification fails closed
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then brew install minisign; else sudo apt-get install -y -qq minisign; fi
          k="$RUNNER_TEMP/sigkey" && mkdir -p "$k"
          minisign -G -W -p "$k/test.pub" -s "$k/test.key"
          export DOCMONK_MINISIGN_PUBKEY="$(sed -n 2p "$k/test.pub")"
          for d in signed tampered unsigned; do rm -rf "$RUNNER_TEMP/$d"; cp -R "$DIST" "$RUNNER_TEMP/$d"; done
          minisign -S -s "$k/test.key" -m "$RUNNER_TEMP/signed/SHA256SUMS"
          cp "$RUNNER_TEMP/signed/SHA256SUMS.minisig" "$RUNNER_TEMP/tampered/"
          echo "$(printf '0%.0s' $(seq 64))  extra.tar.gz" >> "$RUNNER_TEMP/tampered/SHA256SUMS"
          refused() { # <download base> [env...]
            local base="$1"; shift
            if env DOCMONK_VERSION=0.9.0 DOCMONK_DOWNLOAD_BASE="$base" "$@" sh ./install.sh; then
              echo "::error::install from $base was not refused"; exit 1
            fi
          }
          refused "$RUNNER_TEMP/tampered"
          refused "$RUNNER_TEMP/unsigned"
          # No minisign on PATH: only the tools install.sh needs.
          nobin="$RUNNER_TEMP/nobin" && mkdir -p "$nobin"
          for t in sh uname mktemp curl cp awk sha256sum shasum cut rm mkdir mv tar sed ln cat gzip grep head readlink; do
            p="$(command -v "$t" || true)"; [ -n "$p" ] && ln -sf "$p" "$nobin/$t"
          done
          refused "$RUNNER_TEMP/signed" PATH="$nobin"
          DOCMONK_VERSION=0.9.0 DOCMONK_DOWNLOAD_BASE="$RUNNER_TEMP/signed" sh ./install.sh | tee "$RUNNER_TEMP/signed.log"
          grep -q "Signature verified." "$RUNNER_TEMP/signed.log"
          DOCMONK_INSECURE_SKIP_SIGNATURE=1 DOCMONK_VERSION=0.9.0 DOCMONK_DOWNLOAD_BASE="$RUNNER_TEMP/unsigned" sh ./install.sh
          test "$(readlink "$DOCMONK_INSTALL_DIR/current")" = "versions/0.9.0"
      - name: Install 0.9.1, then roll back
        run: |
          DOCMONK_VERSION=0.9.1 sh ./install.sh
          test "$(readlink "$DOCMONK_INSTALL_DIR/current")" = "versions/0.9.1"
          "$DOCMONK_BIN_DIR/docmonk" update rollback
          test "$(readlink "$DOCMONK_INSTALL_DIR/current")" = "versions/0.9.0"
          "$DOCMONK_BIN_DIR/docmonk" version

  install-script-tests-windows:
    name: Install script (windows-latest)
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: windows-latest
    steps:
      # runner.temp is not available in job-level env.
      - name: Paths
        run: |
          $t = $env:RUNNER_TEMP
          @("DIST=$t\dist", "DOCMONK_DOWNLOAD_BASE=$t\dist", "DOCMONK_INSTALL_DIR=$t\docmonk-install",
            "DOCMONK_BIN_DIR=$t\docmonk-bin", "DOCMONK_HOME=$t\docmonk-home") |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build and package two versions
        run: |
          cargo build -p docmonk-cli
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          foreach ($v in "0.9.0", "0.9.1") {
            cargo xtask package --binary target/debug/docmonk.exe `
              --version $v --target x86_64-pc-windows-msvc --out $env:DIST
            if ($LASTEXITCODE -ne 0) { throw "packaging failed" }
          }
      - name: Install 0.9.0
        run: |
          $env:DOCMONK_VERSION = "0.9.0"
          ./install.ps1
      - name: Verify the installed CLI works
        run: |
          & "$env:DOCMONK_BIN_DIR\docmonk.cmd" version
          if ($LASTEXITCODE -ne 0) { throw "version failed" }
          & "$env:DOCMONK_BIN_DIR\docmonk.cmd" doctor
          if ($LASTEXITCODE -ne 0) { throw "doctor failed" }
          $info = Get-Content "$env:DOCMONK_HOME\install_info.json" -Raw | ConvertFrom-Json
          if ($info.install_method -ne "native") { throw "unexpected install_method: $($info.install_method)" }
      # Fail-closed signature checks with a throwaway key (never a release
      # key), as on Linux/macOS.
      - name: Signature verification fails closed
        run: |
          $k = Join-Path $env:RUNNER_TEMP "sigkey"
          New-Item -ItemType Directory -Force -Path $k | Out-Null
          Invoke-WebRequest -UseBasicParsing -OutFile "$k\minisign.zip" `
            -Uri "https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip"
          Expand-Archive "$k\minisign.zip" -DestinationPath "$k\minisign"
          # The archive holds one minisign.exe per architecture.
          $exe = (Get-ChildItem -Recurse -Filter minisign.exe "$k\minisign" |
            Where-Object { $_.FullName -notmatch 'aarch64|arm64' } |
            Sort-Object { $_.FullName -notmatch 'x86_64' } | Select-Object -First 1).FullName
          if (-not $exe) { throw "no x86_64 minisign.exe in the archive" }
          & $exe -G -W -p "$k\test.pub" -s "$k\test.key"
          if ($LASTEXITCODE -ne 0) { throw "key generation failed" }
          $env:DOCMONK_MINISIGN_PUBKEY = (Get-Content "$k\test.pub")[1]
          foreach ($d in "signed", "tampered", "unsigned") {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\$d"
            Copy-Item -Recurse $env:DIST "$env:RUNNER_TEMP\$d"
          }
          & $exe -S -s "$k\test.key" -m "$env:RUNNER_TEMP\signed\SHA256SUMS"
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          Copy-Item "$env:RUNNER_TEMP\signed\SHA256SUMS.minisig" "$env:RUNNER_TEMP\tampered\"
          Add-Content "$env:RUNNER_TEMP\tampered\SHA256SUMS" ("0" * 64 + "  extra.zip")
          $env:DOCMONK_VERSION = "0.9.0"
          function Refused([string]$Base) {
            $env:DOCMONK_DOWNLOAD_BASE = $Base
            $ok = $true
            try { ./install.ps1 } catch { $ok = $false; Write-Host "refused as expected: $_" }
            if ($ok) { throw "install from $Base was not refused" }
          }
          # minisign is not on PATH yet: a signed release is refused.
          Refused "$env:RUNNER_TEMP\signed"
          $env:PATH = "$(Split-Path $exe);$env:PATH"
          Refused "$env:RUNNER_TEMP\tampered"
          Refused "$env:RUNNER_TEMP\unsigned"
          $env:DOCMONK_DOWNLOAD_BASE = "$env:RUNNER_TEMP\signed"
          ./install.ps1
          $env:DOCMONK_INSECURE_SKIP_SIGNATURE = "1"
          $env:DOCMONK_DOWNLOAD_BASE = "$env:RUNNER_TEMP\unsigned"
          ./install.ps1
          if ((Get-Content "$env:DOCMONK_INSTALL_DIR\current" -Raw).Trim() -ne "0.9.0") { throw "not on 0.9.0" }
      # Windows cannot overwrite a running exe: re-installing while the
      # daemon runs from bin\docmonk.exe proves the rename-based swap.
      - name: Install 0.9.1 while the daemon holds the current exe, then roll back
        run: |
          & "$env:DOCMONK_BIN_DIR\docmonk.cmd" daemon start
          if ($LASTEXITCODE -ne 0) { throw "daemon start failed" }
          try {
            $env:DOCMONK_VERSION = "0.9.1"
            ./install.ps1
          } finally {
            & "$env:DOCMONK_BIN_DIR\docmonk.cmd" daemon stop
          }
          if ((Get-Content "$env:DOCMONK_INSTALL_DIR\current" -Raw).Trim() -ne "0.9.1") { throw "not switched" }
          & "$env:DOCMONK_BIN_DIR\docmonk.cmd" update rollback
          if ($LASTEXITCODE -ne 0) { throw "rollback failed" }
          if ((Get-Content "$env:DOCMONK_INSTALL_DIR\current" -Raw).Trim() -ne "0.9.0") { throw "not rolled back" }
          & "$env:DOCMONK_BIN_DIR\docmonk.cmd" version
          if ($LASTEXITCODE -ne 0) { throw "version failed after rollback" }

  # The release image builds (amd64; arm64 builds natively in
  # rust-release.yml), runs from an empty home and ships no interpreter.
  container-image:
    name: Container image (linux/amd64)
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: DOCMONK_VERSION=0.9.0
          tags: docmonk:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm docmonk:ci version --json | grep -q '"0.9.0"'
          # clean-slate-audit: allow-start (asserts the image has no interpreter)
          docker run --rm --entrypoint sh docmonk:ci -c '! command -v python3 && ! command -v python'
          # clean-slate-audit: allow-end
          docker run --rm --entrypoint sh docmonk:ci -c 'docmonk init && docmonk doctor'
          test -n "$(docker run --rm --entrypoint ls docmonk:ci /opt/docmonk/models/all-minilm-l6-v2/model.safetensors)"

  # The one stable required status. Mandatory jobs must succeed; on
  # pushes every job is mandatory; on PRs a conditional job may be
  # skipped only when `changes` succeeded and did not select it.
  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - repository-audits
      - rust-linux
      - rust-windows
      - rust-macos
      - server-integration
      - install-script-tests
      - install-script-tests-windows
      - container-image
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - shell: bash
        env:
          EVENT: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          result() { jq -r --arg j "$1" '.[$j].result // "missing"' <<<"$NEEDS"; }
          output() { jq -r --arg j "$1" --arg o "$2" '.[$j].outputs[$o] // ""' <<<"$NEEDS"; }
          fail=0
          check() { # job, may-skip
            r=$(result "$1")
            if [ "$r" = success ] || { [ "$2" = yes ] && [ "$r" = skipped ]; }; then
              echo "ok   $1: $r"
            else
              echo "FAIL $1: $r"; fail=1
            fi
          }
          for j in changes repository-audits rust-linux server-integration; do check "$j" no; done
          if [ "$EVENT" = pull_request ]; then
            inst=$(output changes installer); dock=$(output changes docker)
            cross=$(output changes cross_platform)
            skip_inst=yes; [ "$inst" = true ] && skip_inst=no
            skip_dock=yes; [ "$dock" = true ] && skip_dock=no
            skip_cross=yes; [ "$cross" = true ] && skip_cross=no
            check rust-windows "$skip_cross"
            check rust-macos "$skip_cross"
            check install-script-tests "$skip_inst"
            check install-script-tests-windows "$skip_inst"
            check container-image "$skip_dock"
          else
            for j in rust-windows rust-macos install-script-tests install-script-tests-windows container-image; do
              check "$j" no
            done
          fi
          exit $fail
