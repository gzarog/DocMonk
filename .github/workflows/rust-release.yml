name: Rust release

# Publishes a DocMonk release (ADR 0030): archives for the
# four release targets with their bundled models, SHA256SUMS (signed with
# minisign when the MINISIGN_SECRET_KEY secret exists), the installers,
# and a multi-arch image on GHCR.
#
# Three ways in:
#   * automatically, after the CI workflow (rust.yml) passes on a push
#     to main: the next vX.Y.Z is computed (patch bump, or minor when the
#     merged commit message contains "[release minor]"), tagged, and
#     published as a full release, which `docmonk update` picks up;
#   * a pushed `v<MAJOR.MINOR.PATCH>` tag: a pre-release with the
#     image, for dry runs;
#   * manual dispatch (default branch only).
#
# Repository settings it reads:
#   vars.MINISIGN_PUBLIC_KEY      compiled into the binary; must equal the key
#                                 committed in install.sh and install.ps1
#   secrets.MINISIGN_SECRET_KEY   the matching minisign secret key file
#   secrets.MINISIGN_PASSWORD     its password (empty for an unencrypted key)
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, MAJOR.MINOR.PATCH (tagged v<version>)"
        required: true
        type: string
      prerelease:
        description: "Publish as a pre-release (not picked up by `docmonk update`)"
        type: boolean
        default: true
      image:
        description: "Also publish the container image to GHCR"
        type: boolean
        default: true

concurrency:
  group: rust-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/docmonk

jobs:
  validate:
    name: Validate version
    # A workflow_run fires for every CI outcome; release only a green push.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      image: ${{ steps.v.outputs.image }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI validated, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      # A tag push carries no inputs: the version comes from the tag, and
      # it is always a pre-release with an image. After CI on main, the
      # next version is computed from the latest v* tag.
      - name: Resolve inputs
        id: v
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_PRERELEASE: ${{ inputs.prerelease }}
          IN_IMAGE: ${{ inputs.image }}
        run: |
          set -eu
          sha="$(git rev-parse HEAD)"
          case "$GITHUB_EVENT_NAME" in
            push)
              v="${GITHUB_REF_NAME#v}"; pre=true; img=true ;;
            workflow_run)
              latest="$(git tag --list 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
              if git log -1 --format=%B | grep -qF '[release minor]'; then bump=minor; else bump=patch; fi
              if [ -z "$latest" ]; then
                v="0.1.0"
              else
                cur="${latest#v}"; major="${cur%%.*}"; rest="${cur#*.}"
                minor="${rest%%.*}"; patch="${rest#*.}"
                if [ "$bump" = minor ]; then v="$major.$((minor + 1)).0"; else v="$major.$minor.$((patch + 1))"; fi
              fi
              echo "Latest tag: ${latest:-<none>}, bump: $bump -> v$v"
              pre=false; img=true ;;
            *)
              v="$IN_VERSION"; pre="$IN_PRERELEASE"; img="$IN_IMAGE" ;;
          esac
          { echo "version=$v"; echo "prerelease=$pre"; echo "image=$img"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
          { echo "VERSION=$v"; echo "TAG=v$v"; } >> "$GITHUB_ENV"
      - name: Strict MAJOR.MINOR.PATCH, tag not taken
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version must be MAJOR.MINOR.PATCH, got '$VERSION'"; exit 1; }
          # A tag push *is* the release tag; every other trigger must not
          # reuse an existing one.
          if [ "$GITHUB_EVENT_NAME" != push ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists"; exit 1
          fi
      # Reserve the version before the long builds, so two merges racing
      # past the concurrency guard cannot both claim it.
      # Pushed with GITHUB_TOKEN, so it does not re-trigger the `v*` tag
      # push event above.
      - name: Push the release tag
        if: github.event_name == 'workflow_run'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      # Every target reports, even when one fails; the release needs all.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: v${{ needs.validate.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install; rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Fetch the bundled models
        run: sh scripts/fetch_models.sh "$RUNNER_TEMP/models"
      - name: Build
        env:
          DOCMONK_BUILD_VERSION: ${{ needs.validate.outputs.version }}
          DOCMONK_BUILD_COMMIT: ${{ needs.validate.outputs.sha }}
          DOCMONK_MINISIGN_PUBKEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: cargo build --release --locked -p docmonk-cli --target ${{ matrix.target }}
      - name: Smoke test
        run: |
          EXE=target/${{ matrix.target }}/release/docmonk
          [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          # No `tee /dev/stderr`: Git Bash on Windows has no /dev/stderr.
          out="$("$EXE" version --json)"
          echo "$out"
          echo "$out" | grep -q "\"$VERSION\""
          echo "EXE=$EXE" >> "$GITHUB_ENV"
      - name: Package
        run: |
          cargo xtask package --binary "$EXE" --version "$VERSION" \
            --target ${{ matrix.target }} --models "$RUNNER_TEMP/models" --out dist
          mv dist/SHA256SUMS "dist/SHA256SUMS.${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: v${{ needs.validate.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS and installers
        env:
          PUBKEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: |
          cargo xtask release-manifest --dist dist
          cat dist/SHA256SUMS
          # The installers on main carry the release key themselves, so the
          # README one-liners verify signatures too. The committed key must
          # be the configured one; the installers are published unchanged.
          sh_key="$(sed -n 's/^MINISIGN_PUBKEY="\(.*\)"$/\1/p' install.sh)"
          ps_key="$(sed -n 's/^\$MinisignPubkey = "\(.*\)"$/\1/p' install.ps1)"
          if [ "$sh_key" != "$PUBKEY" ] || [ "$ps_key" != "$PUBKEY" ]; then
            echo "::error::install.sh/install.ps1 key differs from vars.MINISIGN_PUBLIC_KEY; commit the public key to both installers"
            exit 1
          fi
          cp install.sh install.ps1 dist/
      - name: Sign SHA256SUMS (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          PUBKEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            # A configured public key means installers and docmonk update
            # require a signature: never publish a release they would refuse.
            if [ -n "$PUBKEY" ]; then
              echo "::error::vars.MINISIGN_PUBLIC_KEY is set but MINISIGN_SECRET_KEY is not; refusing to publish an unsigned release"
              exit 1
            fi
            echo "::notice::MINISIGN_SECRET_KEY is not set; publishing checksums only"
            exit 0
          fi
          if [ -z "$PUBKEY" ]; then
            echo "::error::MINISIGN_SECRET_KEY is set but vars.MINISIGN_PUBLIC_KEY is not; set the public key"
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/minisign.key" \
            -m dist/SHA256SUMS -t "DocMonk $TAG SHA256SUMS"
          rm -f "$RUNNER_TEMP/minisign.key"
          test -s dist/SHA256SUMS.minisig || { echo "::error::no SHA256SUMS.minisig was produced"; exit 1; }
          # Verify with the public key before anything is published.
          minisign -Vm dist/SHA256SUMS -P "$PUBKEY"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          flags=""
          [ "$PRERELEASE" = "true" ] && flags="--prerelease"
          cat > notes.md <<NOTES
          DocMonk $VERSION.

          Install: \`curl -fsSL https://github.com/${{ github.repository }}/releases/download/$TAG/install.sh | sh\`
          (Windows: \`irm https://github.com/${{ github.repository }}/releases/download/$TAG/install.ps1 | iex\`).
          Existing native installs: \`docmonk update install\`.

          Container: \`docker pull $IMAGE:$VERSION\`

          Every archive is listed in SHA256SUMS; SHA256SUMS.minisig, when present, is its minisign signature.
          NOTES
          gh release create "$TAG" dist/* --target "${{ needs.validate.outputs.sha }}" \
            --title "DocMonk $VERSION" --notes-file notes.md $flags

  image:
    name: Image (${{ matrix.platform }})
    needs: validate
    if: needs.validate.outputs.image == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: v${{ needs.validate.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            DOCMONK_VERSION=${{ needs.validate.outputs.version }}
            DOCMONK_COMMIT=${{ needs.validate.outputs.sha }}
            DOCMONK_MINISIGN_PUBKEY=${{ vars.MINISIGN_PUBLIC_KEY }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Smoke test
        run: |
          docker run --rm --platform ${{ matrix.platform }} "$IMAGE@${{ steps.build.outputs.digest }}" version --json \
            | grep -q "\"$VERSION\""
      - name: Record the digest
        run: |
          mkdir -p digests
          d="${{ steps.build.outputs.digest }}"
          touch "digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error

  image-manifest:
    name: Publish the multi-arch image
    needs: [validate, image, release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: v${{ needs.validate.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag the manifest list
        env:
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          tags="-t $IMAGE:$VERSION"
          [ "$PRERELEASE" = "true" ] || tags="$tags -t $IMAGE:latest"
          docker buildx imagetools create $tags $(for d in digests/*; do echo "$IMAGE@sha256:$(basename "$d")"; done)
          docker buildx imagetools inspect "$IMAGE:$VERSION"
