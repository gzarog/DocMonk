# cargo-deny policy (ADR 0003). CI runs `cargo deny check` in the
# Repository audits job on every PR and push; the nightly workflow runs
# `cargo deny check advisories` against main so advisories published
# between PRs are caught (docs/CI.md).

[graph]
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# Vulnerabilities always fail; unmaintained and unsound crates are reported
# so they can be replaced, without blocking unrelated PRs.
unmaintained = "workspace"
yanked = "warn"
# Every ignore needs a reason and a review date. Remove an entry as soon as
# the lockfile no longer carries the affected version.
ignore = [
  # zip < 9: path traversal and permission issues in ZipArchive::extract and
  # ZipStreamReader::extract only. No workspace crate calls either: the
  # updater and xtask place every entry themselves
  # (crates/docmonk-update/src/install.rs: enclosed_name, own placement,
  # mode masked to 0o755), and candle-core (zip 1, pinned =0.9.1) only
  # reads archive members by name. Blocked on candle-core moving to
  # zip >= 9. Review by 2027-01-31.
  { id = "RUSTSEC-2026-0367", reason = "extract-only; not called (see above); review 2027-01-31" },
  { id = "RUSTSEC-2026-0368", reason = "extract-only; not called (see above); review 2027-01-31" },
  { id = "RUSTSEC-2026-0369", reason = "extract-only; not called (see above); review 2027-01-31" },
  # zip < 9, published 2026-11. Only candle-core (zip 1, pinned =0.9.1)
  # still carries zip < 9; docling/calamine and the workspace are on zip 9.
  # candle-core only reads archive members by name (pickle.rs, npy.rs):
  # nothing calls ZipArchive::extract, extract_unwrapped_root_dir,
  # ZipStreamReader or read_zipfile_from_stream (0429, 0546, 0548), and it
  # enables none of zip's optional features (`cargo tree -e features
  # -i zip@1.1.4`), so the AES (0545) and Shrink/Reduce/Implode decoder
  # (0547) code is not compiled. Blocked on candle-core moving to zip >= 9;
  # review 2027-01-31.
  { id = "RUSTSEC-2026-0429", reason = "extract-only; not called (see above); review 2027-01-31" },
  { id = "RUSTSEC-2026-0545", reason = "aes-crypto feature not enabled; review 2027-01-31" },
  { id = "RUSTSEC-2026-0546", reason = "extract-only; not called (see above); review 2027-01-31" },
  { id = "RUSTSEC-2026-0547", reason = "Shrink/Reduce/Implode decoder feature not enabled; review 2027-01-31" },
  { id = "RUSTSEC-2026-0548", reason = "ZipStreamReader not used (see above); review 2027-01-31" },
]

[licenses]
version = 2
# Permissive licences compatible with shipping MIT binaries (ADR 0003).
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# MPL-2.0 is file-level copyleft: shipping these unmodified crates in an
# MIT binary is fine, but it stays an explicit per-crate exception (the
# HTML/CSS selector stack docling uses), not a blanket allowance.
exceptions = [
  { allow = ["MPL-2.0"], crate = "cssparser" },
  { allow = ["MPL-2.0"], crate = "cssparser-macros" },
  { allow = ["MPL-2.0"], crate = "dtoa-short" },
  { allow = ["MPL-2.0"], crate = "selectors" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
