# cargo-deny policy (ADR 0003). CI runs `cargo deny check` in the
# Repository audits job on every PR and push; the nightly workflow runs
# `cargo deny check advisories` against main so advisories published
# between PRs are caught (docs/CI.md).

[graph]
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# Vulnerabilities always fail; unmaintained and unsound crates are reported
# so they can be replaced, without blocking unrelated PRs.
unmaintained = "workspace"
yanked = "warn"
# Every ignore needs a reason and a review date. Remove an entry as soon as
# the lockfile no longer carries the affected version.
ignore = [
  # zip < 9: path traversal, permission and abort-on-symlink issues in
  # ZipArchive::extract and ZipStreamReader::extract only. No workspace
  # crate calls either: the updater and xtask place every entry themselves
  # (crates/docmonk-update/src/install.rs: enclosed_name, own placement,
  # mode masked to 0o755), and calamine/docling (zip 8) and candle-core
  # (zip 1, pinned =0.9.1) only read archive members by name. Re-checked
  # on 2026-11-11 by searching the workspace and the calamine 0.36.1,
  # docling 1.89.0 and candle-core 0.9.1 sources for both calls: none.
  # calamine has moved to zip 9 (0.37), but only docling 2.x uses it, and
  # docling 2.x needs Rust 1.92 (the toolchain is 1.90, the MSRV 1.89).
  # Blocked on that toolchain decision and on candle-core. Review by
  # 2027-01-31.
  { id = "RUSTSEC-2026-0367", reason = "extract-only; not called (see above); review 2027-01-31" },
  { id = "RUSTSEC-2026-0368", reason = "extract-only; not called (see above); review 2027-01-31" },
  { id = "RUSTSEC-2026-0369", reason = "extract-only; not called (see above); review 2027-01-31" },
  { id = "RUSTSEC-2026-0429", reason = "extract-only; not called (see above); review 2027-01-31" },
  # calamine < 0.38: panic and unbounded allocation in the CFB/OLE2 parser,
  # which calamine 0.36.1 uses for binary .xls workbooks (Xls) and for VBA
  # projects (vba_project) only. Neither is reached: docmonk-convert has
  # no .xls format and passes docling an explicit InputFormat, never Xls
  # (crates/docmonk-convert/src/converter.rs), and docling's xlsx backend
  # never reads a VBA project. The fix (calamine 0.38) needs docling 2.x
  # and so Rust 1.92, as above. Review when the toolchain moves, and at
  # the latest by 2027-01-31; do not add an .xls format before then.
  { id = "RUSTSEC-2026-0436", reason = "CFB parser only for .xls and VBA; neither reached (see above); review 2027-01-31" },
]

[licenses]
version = 2
# Permissive licences compatible with shipping MIT binaries (ADR 0003).
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# MPL-2.0 is file-level copyleft: shipping these unmodified crates in an
# MIT binary is fine, but it stays an explicit per-crate exception (the
# HTML/CSS selector stack docling uses), not a blanket allowance.
exceptions = [
  { allow = ["MPL-2.0"], crate = "cssparser" },
  { allow = ["MPL-2.0"], crate = "cssparser-macros" },
  { allow = ["MPL-2.0"], crate = "dtoa-short" },
  { allow = ["MPL-2.0"], crate = "selectors" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
